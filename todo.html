<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List | Anvita</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .todo-container {
      background: white;
      width: 100%;
      max-width: 500px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      opacity: 0.9;
    }

    ul {
      list-style: none;
      margin-top: 25px;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      margin-bottom: 10px;
      background: #f1f5f9;
      border-radius: 8px;
    }

    li span {
      cursor: pointer;
    }

    li.completed span {
      text-decoration: line-through;
      color: #777;
    }

    .delete-btn {
      background: #dc2626;
      padding: 7px 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="todo-container">

    <h1>My To-Do List</h1>

    <div class="input-area">
      <input
        type="text"
        id="taskInput"
        placeholder="Enter a task..."
      >

      <button onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>

  </div>

  <script>
    function addTask() {
      const input = document.getElementById("taskInput");
      const taskText = input.value.trim();

      if (taskText === "") {
        alert("Please enter a task.");
        return;
      }

      const li = document.createElement("li");

      const span = document.createElement("span");
      span.textContent = taskText;

      span.onclick = function () {
        li.classList.toggle("completed");
      };

      const deleteButton = document.createElement("button");
      deleteButton.textContent = "Delete";
      deleteButton.className = "delete-btn";

      deleteButton.onclick = function () {
        li.remove();
      };

      li.appendChild(span);
      li.appendChild(deleteButton);

      document.getElementById("taskList").appendChild(li);

      input.value = "";
      input.focus();
    }

    document.getElementById("taskInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        addTask();
      }
    });
  </script>

</body>
</html>
